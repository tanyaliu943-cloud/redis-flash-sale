services:
  - type: web
    name: redis-flash-sale-web
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-flash-sale-kv
          property: connectionString

  - type: keyvalue
    name: redis-flash-sale-kv
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []
